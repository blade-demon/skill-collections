<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- Left: Design Mockup Frame -->
  <rect x="22" y="52" width="88" height="152" rx="12"
        fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>

  <!-- Mockup title bar -->
  <rect x="30" y="64" width="72" height="13" rx="3" fill="rgba(255,255,255,0.5)"/>

  <!-- Mockup hero image block -->
  <rect x="30" y="83" width="72" height="42" rx="4" fill="rgba(255,255,255,0.22)"/>
  <line x1="30" y1="83" x2="102" y2="125" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="30" y1="105" x2="80" y2="125" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Mockup text lines -->
  <rect x="30" y="133" width="72" height="6" rx="2" fill="rgba(255,255,255,0.38)"/>
  <rect x="30" y="145" width="52" height="6" rx="2" fill="rgba(255,255,255,0.28)"/>

  <!-- Mockup tag chips -->
  <rect x="30" y="159" width="32" height="10" rx="5" fill="rgba(255,255,255,0.28)"/>
  <rect x="68" y="159" width="34" height="10" rx="5" fill="rgba(255,255,255,0.28)"/>

  <!-- Mockup CTA button -->
  <rect x="38" y="176" width="56" height="16" rx="8" fill="rgba(255,255,255,0.42)"/>

  <!-- Center Arrow -->
  <g transform="translate(128,128)" stroke="white" stroke-width="3.5"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="-13" y1="0" x2="9" y2="0"/>
    <polyline points="3,-7 13,0 3,7"/>
  </g>

  <!-- Right: Spec Document -->
  <rect x="146" y="52" width="88" height="152" rx="12"
        fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>

  <!-- Spec doc title -->
  <rect x="154" y="65" width="46" height="8" rx="2" fill="rgba(255,255,255,0.78)"/>

  <!-- Spec Section 1 heading -->
  <rect x="154" y="82" width="36" height="6" rx="2" fill="rgba(255,255,255,0.62)"/>
  <!-- Scenario lines -->
  <rect x="160" y="94"  width="66" height="4" rx="2" fill="rgba(255,255,255,0.38)"/>
  <rect x="160" y="103" width="50" height="4" rx="2" fill="rgba(255,255,255,0.28)"/>
  <rect x="160" y="112" width="58" height="4" rx="2" fill="rgba(255,255,255,0.33)"/>

  <!-- Spec Section 2 heading -->
  <rect x="154" y="126" width="44" height="6" rx="2" fill="rgba(255,255,255,0.62)"/>
  <!-- Scenario lines -->
  <rect x="160" y="138" width="66" height="4" rx="2" fill="rgba(255,255,255,0.38)"/>
  <rect x="160" y="147" width="42" height="4" rx="2" fill="rgba(255,255,255,0.28)"/>

  <!-- Spec Section 3 heading -->
  <rect x="154" y="161" width="52" height="6" rx="2" fill="rgba(255,255,255,0.62)"/>
  <!-- Scenario lines -->
  <rect x="160" y="173" width="66" height="4" rx="2" fill="rgba(255,255,255,0.38)"/>
  <rect x="160" y="182" width="54" height="4" rx="2" fill="rgba(255,255,255,0.28)"/>
</svg>
