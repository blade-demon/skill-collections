# API_Schema 契约模板
# 阶段二：接口提纯产物。从接口文档中提取，在内部分析完成后输出此 YAML 代码块。
# 填写规则：
#   - 只保留组件实际消费的字段；Header、鉴权等通用字段默认过滤
#   - 分页游标、排序、筛选、缓存 key 等字段如果影响 UI 或请求状态，必须保留
#   - 枚举值必须完整列出；不确定时写 enums: [UNKNOWN] 并加 api.open_questions
#   - 无接口文档时：endpoints: []，后续阶段字段来源降级为 inferred

api:
  endpoints:
    - id: endpointId             # 短标识符，camelCase，在 Mapping_Logic 中引用
      url: /api/v1/resource
      method: GET                # GET / POST / PUT / DELETE / PATCH
      params:
        - name: paramName
          type: string           # string / number / boolean / array / object
          required: true
          notes: ""              # 参数含义或约束
      response_fields:
        - name: data.fieldName   # 点号路径，例如 data.results / data.items[].id
          type: string           # string / number / boolean / array / object
          item_type: ""          # 仅 type=array 时填写，例如 object / string
          nullable: false
          enums: []              # 枚举值列表，例如 [ACTIVE, SUSPENDED, CLOSED]；非枚举写 []
          notes: ""              # 字段含义、格式约束、单位
  open_questions:
    - id: oq_api_1
      content: "具体待确认问题，例如：status 枚举值是否完整"
      priority: P0               # P0 = 阻塞实现；P1 = 影响细节；P2 = 可后续确认
