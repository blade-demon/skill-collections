<?xml version="1.0" encoding="UTF-8"?>
<!--
  search-panel sample 输入 mockup —— 搜索框 + 提交按钮 + 结果列表。
  4 个面板对应运行时四态：idle / loading / success / empty/error。
  完全虚构，零版权风险。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 832 480" width="832" height="480"
     font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">

  <!-- 页面背景 -->
  <rect width="832" height="480" fill="#F4F5F7"/>

  <!-- 顶部说明 -->
  <text x="24" y="32" font-size="14" font-weight="600" fill="#1D2129">SearchPanel — 4 状态运行时视图</text>
  <text x="24" y="52" font-size="11" fill="#86909C">输入框 + 提交按钮触发 GET /api/v1/search；结果区根据响应渲染列表 / 空态 / 错误态</text>

  <defs>
    <!-- skeleton 占位条纹动画感的渐变（静态预览） -->
    <linearGradient id="skeletonGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2F3F5"/>
      <stop offset="50%" stop-color="#E5E6EB"/>
      <stop offset="100%" stop-color="#F2F3F5"/>
    </linearGradient>
  </defs>

  <!-- ============================== -->
  <!-- Card 1: idle（初始空态，未提交） -->
  <!-- ============================== -->
  <g transform="translate(24, 80)">
    <rect width="180" height="380" rx="12" ry="12" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1"/>

    <!-- 状态标签 -->
    <rect x="12" y="12" width="40" height="20" rx="10" ry="10" fill="#F2F3F5"/>
    <text x="32" y="26" font-size="11" font-weight="500" fill="#86909C" text-anchor="middle">idle</text>

    <!-- 搜索输入框 -->
    <rect x="12" y="44" width="120" height="32" rx="6" ry="6" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1"/>
    <text x="20" y="64" font-size="12" fill="#C9CDD4">搜索关键词</text>

    <!-- 提交按钮 -->
    <rect x="138" y="44" width="32" height="32" rx="6" ry="6" fill="#1664FF"/>
    <text x="154" y="64" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">搜</text>

    <!-- 结果区分隔线 -->
    <line x1="12" y1="92" x2="168" y2="92" stroke="#E5E6EB" stroke-width="1"/>

    <!-- 引导文案 -->
    <text x="90" y="200" font-size="12" fill="#86909C" text-anchor="middle">请输入关键词后</text>
    <text x="90" y="220" font-size="12" fill="#86909C" text-anchor="middle">点击搜索</text>
  </g>

  <!-- ============================== -->
  <!-- Card 2: loading（请求中，骨架占位） -->
  <!-- ============================== -->
  <g transform="translate(216, 80)">
    <rect width="180" height="380" rx="12" ry="12" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1"/>

    <!-- 状态标签 -->
    <rect x="12" y="12" width="60" height="20" rx="10" ry="10" fill="#E8F3FF"/>
    <text x="42" y="26" font-size="11" font-weight="500" fill="#1664FF" text-anchor="middle">loading</text>

    <!-- 搜索输入框（已输入）-->
    <rect x="12" y="44" width="120" height="32" rx="6" ry="6" fill="#FFFFFF" stroke="#1664FF" stroke-width="1.5"/>
    <text x="20" y="64" font-size="12" fill="#1D2129">React Hook</text>

    <!-- 提交按钮（loading 状态半透明）-->
    <rect x="138" y="44" width="32" height="32" rx="6" ry="6" fill="#1664FF" opacity="0.6"/>
    <circle cx="154" cy="60" r="6" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- 分隔线 -->
    <line x1="12" y1="92" x2="168" y2="92" stroke="#E5E6EB" stroke-width="1"/>

    <!-- 骨架屏：3 行结果占位 -->
    <rect x="12" y="108" width="156" height="14" rx="3" fill="url(#skeletonGradient)"/>
    <rect x="12" y="128" width="100" height="10" rx="3" fill="url(#skeletonGradient)"/>

    <rect x="12" y="156" width="156" height="14" rx="3" fill="url(#skeletonGradient)"/>
    <rect x="12" y="176" width="120" height="10" rx="3" fill="url(#skeletonGradient)"/>

    <rect x="12" y="204" width="156" height="14" rx="3" fill="url(#skeletonGradient)"/>
    <rect x="12" y="224" width="80" height="10" rx="3" fill="url(#skeletonGradient)"/>
  </g>

  <!-- ============================== -->
  <!-- Card 3: success（有结果，3 条） -->
  <!-- ============================== -->
  <g transform="translate(408, 80)">
    <rect width="180" height="380" rx="12" ry="12" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1"/>

    <!-- 状态标签 -->
    <rect x="12" y="12" width="60" height="20" rx="10" ry="10" fill="#E8F8E8"/>
    <text x="42" y="26" font-size="11" font-weight="500" fill="#00B42A" text-anchor="middle">success</text>

    <!-- 搜索框 -->
    <rect x="12" y="44" width="120" height="32" rx="6" ry="6" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1"/>
    <text x="20" y="64" font-size="12" fill="#1D2129">React Hook</text>

    <!-- 提交按钮 -->
    <rect x="138" y="44" width="32" height="32" rx="6" ry="6" fill="#1664FF"/>
    <text x="154" y="64" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">搜</text>

    <!-- 结果计数 -->
    <line x1="12" y1="92" x2="168" y2="92" stroke="#E5E6EB" stroke-width="1"/>
    <text x="12" y="108" font-size="11" fill="#86909C">共 3 条结果</text>

    <!-- Result 1 -->
    <text x="12" y="132" font-size="12" font-weight="500" fill="#1D2129">useEffect 入门指南</text>
    <text x="12" y="148" font-size="11" fill="#86909C">React 副作用钩子的使用…</text>
    <line x1="12" y1="158" x2="168" y2="158" stroke="#F2F3F5" stroke-width="1"/>

    <!-- Result 2 -->
    <text x="12" y="178" font-size="12" font-weight="500" fill="#1D2129">自定义 Hook 设计模式</text>
    <text x="12" y="194" font-size="11" fill="#86909C">如何抽离逻辑到可复用钩子…</text>
    <line x1="12" y1="204" x2="168" y2="204" stroke="#F2F3F5" stroke-width="1"/>

    <!-- Result 3 -->
    <text x="12" y="224" font-size="12" font-weight="500" fill="#1D2129">useState 性能陷阱</text>
    <text x="12" y="240" font-size="11" fill="#86909C">大对象 state 的优化技巧…</text>
  </g>

  <!-- ============================== -->
  <!-- Card 4: empty / error 双面板 -->
  <!-- ============================== -->
  <g transform="translate(600, 80)">
    <!-- empty 上半 -->
    <rect width="180" height="184" rx="12" ry="12" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1"/>

    <rect x="12" y="12" width="50" height="20" rx="10" ry="10" fill="#FFF7E8"/>
    <text x="37" y="26" font-size="11" font-weight="500" fill="#FF7D00" text-anchor="middle">empty</text>

    <rect x="12" y="44" width="120" height="32" rx="6" ry="6" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1"/>
    <text x="20" y="64" font-size="12" fill="#1D2129">xyz123nonexistent</text>

    <rect x="138" y="44" width="32" height="32" rx="6" ry="6" fill="#1664FF"/>
    <text x="154" y="64" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">搜</text>

    <line x1="12" y1="92" x2="168" y2="92" stroke="#E5E6EB" stroke-width="1"/>

    <!-- 空态图标 + 文案 -->
    <circle cx="90" cy="124" r="14" fill="none" stroke="#C9CDD4" stroke-width="1.5"/>
    <line x1="100" y1="134" x2="108" y2="142" stroke="#C9CDD4" stroke-width="1.5"/>
    <text x="90" y="166" font-size="12" fill="#86909C" text-anchor="middle">未找到相关结果</text>
  </g>

  <g transform="translate(600, 280)">
    <!-- error 下半 -->
    <rect width="180" height="180" rx="12" ry="12" fill="#FFFFFF" stroke="#FFE3DB" stroke-width="1"/>

    <rect x="12" y="12" width="48" height="20" rx="10" ry="10" fill="#FFECE8"/>
    <text x="36" y="26" font-size="11" font-weight="500" fill="#F53F3F" text-anchor="middle">error</text>

    <rect x="12" y="44" width="120" height="32" rx="6" ry="6" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1"/>
    <text x="20" y="64" font-size="12" fill="#1D2129">React Hook</text>

    <rect x="138" y="44" width="32" height="32" rx="6" ry="6" fill="#1664FF"/>
    <text x="154" y="64" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">搜</text>

    <line x1="12" y1="92" x2="168" y2="92" stroke="#E5E6EB" stroke-width="1"/>

    <!-- error 图标 + 文案 + 重试按钮 -->
    <circle cx="90" cy="118" r="10" fill="#F53F3F"/>
    <text x="90" y="123" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">!</text>
    <text x="90" y="148" font-size="12" fill="#1D2129" text-anchor="middle">网络异常，请重试</text>

    <!-- 重试按钮 -->
    <rect x="60" y="156" width="60" height="20" rx="4" fill="#FFFFFF" stroke="#1664FF" stroke-width="1"/>
    <text x="90" y="170" font-size="11" font-weight="500" fill="#1664FF" text-anchor="middle">重试</text>
  </g>

  <!-- 底部对照说明 -->
  <text x="24" y="476" font-size="11" fill="#4E5969">触发顺序：用户输入 → 点击搜 → idle → loading → (success | empty | error)；error 态额外提供 retryButton</text>
</svg>
