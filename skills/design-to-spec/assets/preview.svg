<svg width="1864" height="800" viewBox="0 0 1864 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">design-to-spec preview</title>
  <desc id="desc">Preview graphic for design-to-spec showing a four-stage YAML contract pipeline with schema validation and generated implementation specs.</desc>
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="1864" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08111F"/>
      <stop offset="0.55" stop-color="#0D1B24"/>
      <stop offset="1" stop-color="#071318"/>
    </linearGradient>
    <linearGradient id="icon-bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#102033"/>
      <stop offset="0.52" stop-color="#142A35"/>
      <stop offset="1" stop-color="#0C1A24"/>
    </linearGradient>
    <linearGradient id="ui-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="api-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="map-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="spec-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="card-shadow" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, SF Mono, Consolas, Liberation Mono, monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
      .muted { fill: #94A3B8; }
      .soft { fill: #CBD5E1; }
      .white { fill: #F8FAFC; }
      .panel { fill: #0F1C26; stroke: #243447; stroke-width: 1.5; }
      .line { stroke: #334155; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1864" height="800" fill="url(#page-bg)"/>
  <rect x="0" y="0" width="1864" height="6" fill="url(#ui-grad)"/>

  <g id="brand" transform="translate(64 82)">
    <g transform="scale(0.58)">
      <rect width="256" height="256" rx="48" fill="url(#icon-bg)"/>
      <rect x="18" y="18" width="220" height="220" rx="38" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
      <rect x="34" y="46" width="74" height="74" rx="18" fill="#0F172A" stroke="#4F8CFF" stroke-opacity="0.75" stroke-width="2"/>
      <rect x="46" y="60" width="50" height="9" rx="3" fill="url(#ui-grad)"/>
      <rect x="46" y="77" width="50" height="20" rx="5" fill="#4F8CFF" fill-opacity="0.18"/>
      <rect x="46" y="104" width="30" height="5" rx="2.5" fill="#BFE3FF" fill-opacity="0.78"/>
      <rect x="80" y="104" width="16" height="5" rx="2.5" fill="#2DD4BF" fill-opacity="0.9"/>
      <rect x="148" y="46" width="74" height="74" rx="18" fill="#0F172A" stroke="#F59E0B" stroke-opacity="0.8" stroke-width="2"/>
      <path d="M174 69 L162 83 L174 97" fill="none" stroke="#FDBA74" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M196 69 L208 83 L196 97" fill="none" stroke="#FDBA74" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="178" y="80" width="14" height="6" rx="3" fill="#F97316" fill-opacity="0.9"/>
      <rect x="76" y="138" width="104" height="72" rx="20" fill="#0F172A" stroke="#22C55E" stroke-opacity="0.82" stroke-width="2"/>
      <rect x="94" y="154" width="68" height="7" rx="3.5" fill="url(#spec-grad)"/>
      <rect x="94" y="170" width="58" height="5" rx="2.5" fill="#D1FAE5" fill-opacity="0.72"/>
      <rect x="94" y="183" width="42" height="5" rx="2.5" fill="#D1FAE5" fill-opacity="0.48"/>
      <path d="M145 188 L153 196 L168 178" fill="none" stroke="#22C55E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M111 80 H141" stroke="#7DD3FC" stroke-width="4" stroke-linecap="round"/>
      <path d="M135 72 L143 80 L135 88" fill="none" stroke="#7DD3FC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M102 118 L116 135 M154 118 L140 135" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
      <rect x="94" y="86" width="36" height="36" rx="11" fill="#142A35" stroke="#CBD5E1" stroke-opacity="0.45" stroke-width="2"/>
      <circle cx="105" cy="99" r="3.5" fill="#4F8CFF"/>
      <circle cx="120" cy="99" r="3.5" fill="#F59E0B"/>
      <circle cx="112" cy="113" r="3.5" fill="#22C55E"/>
    </g>

    <text x="0" y="220" class="mono white" font-size="46" font-weight="750">design-to-spec</text>
    <text x="0" y="266" class="sans muted" font-size="22">UI design plus API contracts into implementation specs</text>
    <text x="0" y="298" class="sans muted" font-size="18">Four-stage state machine with YAML contracts and validation gates</text>

    <g transform="translate(0 340)">
      <rect x="0" y="0" width="78" height="30" rx="15" fill="#102A3C" stroke="#275A78"/>
      <text x="39" y="20" class="mono" font-size="13" font-weight="700" fill="#7DD3FC" text-anchor="middle">v0.7.2</text>
      <rect x="92" y="0" width="132" height="30" rx="15" fill="#132D28" stroke="#1F6B5A"/>
      <text x="158" y="20" class="mono" font-size="13" font-weight="700" fill="#5EEAD4" text-anchor="middle">schema-first</text>
      <rect x="238" y="0" width="122" height="30" rx="15" fill="#2B2110" stroke="#7C4A12"/>
      <text x="299" y="20" class="mono" font-size="13" font-weight="700" fill="#FDBA74" text-anchor="middle">no re-guess</text>
    </g>
  </g>

  <line x1="470" y1="52" x2="470" y2="748" stroke="#1E293B" stroke-width="1.5"/>

  <g id="pipeline" transform="translate(520 68)">
    <text x="0" y="0" class="sans white" font-size="28" font-weight="760">Contract pipeline</text>
    <text x="0" y="34" class="sans muted" font-size="17">Each stage emits a checked artifact; final files are assembled from contracts, not fresh guesses.</text>

    <g id="stage1" transform="translate(0 78)" filter="url(#card-shadow)">
      <rect width="290" height="182" rx="18" class="panel"/>
      <rect width="290" height="6" rx="3" fill="url(#ui-grad)"/>
      <text x="22" y="38" class="mono white" font-size="18" font-weight="720">1 UI_Schema</text>
      <text x="22" y="67" class="sans muted" font-size="14">Visual extraction</text>
      <rect x="22" y="88" width="108" height="58" rx="10" fill="#132438" stroke="#285A8B"/>
      <rect x="36" y="101" width="80" height="8" rx="4" fill="#60A5FA"/>
      <rect x="36" y="116" width="60" height="6" rx="3" fill="#93C5FD" fill-opacity="0.75"/>
      <rect x="36" y="130" width="34" height="6" rx="3" fill="#2DD4BF" fill-opacity="0.85"/>
      <text x="150" y="101" class="mono soft" font-size="12">components[]</text>
      <text x="150" y="122" class="mono soft" font-size="12">states[]</text>
      <text x="150" y="143" class="mono soft" font-size="12">render_assertion</text>
    </g>

    <g id="stage2" transform="translate(328 78)" filter="url(#card-shadow)">
      <rect width="290" height="182" rx="18" class="panel"/>
      <rect width="290" height="6" rx="3" fill="url(#api-grad)"/>
      <text x="22" y="38" class="mono white" font-size="18" font-weight="720">2 API_Schema</text>
      <text x="22" y="67" class="sans muted" font-size="14">Interface extraction</text>
      <rect x="22" y="88" width="246" height="58" rx="10" fill="#2C1E11" stroke="#8A541D"/>
      <text x="38" y="111" class="mono" font-size="13" fill="#FDBA74">GET /api/v1/search</text>
      <text x="38" y="132" class="mono" font-size="12" fill="#FED7AA">params + response_fields</text>
      <text x="22" y="164" class="mono soft" font-size="12">api.open_questions[]</text>
    </g>

    <g id="stage3" transform="translate(656 78)" filter="url(#card-shadow)">
      <rect width="290" height="182" rx="18" class="panel"/>
      <rect width="290" height="6" rx="3" fill="url(#map-grad)"/>
      <text x="22" y="38" class="mono white" font-size="18" font-weight="720">3 Mapping_Logic</text>
      <text x="22" y="67" class="sans muted" font-size="14">Bindings and state machine</text>
      <circle cx="62" cy="118" r="18" fill="#1E2A44" stroke="#38BDF8"/>
      <circle cx="144" cy="118" r="18" fill="#2B1F3D" stroke="#A855F7"/>
      <circle cx="226" cy="118" r="18" fill="#17342E" stroke="#2DD4BF"/>
      <path d="M82 118 H122 M164 118 H204" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
      <text x="36" y="164" class="mono soft" font-size="12">requests[] + bindings[]</text>
    </g>

    <g id="stage4" transform="translate(984 78)" filter="url(#card-shadow)">
      <rect width="290" height="182" rx="18" class="panel"/>
      <rect width="290" height="6" rx="3" fill="url(#spec-grad)"/>
      <text x="22" y="38" class="mono white" font-size="18" font-weight="720">4 GENERATING_SPEC</text>
      <text x="22" y="67" class="sans muted" font-size="14">Template assembly</text>
      <rect x="24" y="88" width="72" height="64" rx="10" fill="#122D2A" stroke="#1F766B"/>
      <rect x="110" y="88" width="72" height="64" rx="10" fill="#132438" stroke="#285A8B"/>
      <rect x="196" y="88" width="72" height="64" rx="10" fill="#173020" stroke="#247A3F"/>
      <text x="60" y="122" class="mono" font-size="11" fill="#5EEAD4" text-anchor="middle">notes</text>
      <text x="146" y="122" class="mono" font-size="11" fill="#93C5FD" text-anchor="middle">data</text>
      <text x="232" y="122" class="mono" font-size="11" fill="#86EFAC" text-anchor="middle">spec</text>
    </g>

    <g stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M298 168 H318"/>
      <path d="M610 168 H646"/>
      <path d="M938 168 H974"/>
      <path d="M314 160 L322 168 L314 176"/>
      <path d="M642 160 L650 168 L642 176"/>
      <path d="M970 160 L978 168 L970 176"/>
    </g>

    <g id="validation" transform="translate(0 306)">
      <text x="0" y="0" class="sans white" font-size="25" font-weight="740">Validation gates</text>
      <text x="0" y="30" class="sans muted" font-size="16">Schema checks catch malformed contracts; output checks catch drift in generated docs.</text>

      <g transform="translate(0 66)" filter="url(#card-shadow)">
        <rect width="620" height="184" rx="18" class="panel"/>
        <rect x="24" y="24" width="70" height="70" rx="16" fill="#102A3C" stroke="#2E6F93"/>
        <path d="M43 59 L56 72 L78 46" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="116" y="46" class="mono white" font-size="20" font-weight="720">validate-contracts.py</text>
        <text x="116" y="76" class="sans muted" font-size="15">JSON Schema first, then cross-file references.</text>
        <text x="116" y="112" class="mono soft" font-size="13">ui.components[].parent_id -&gt; existing component</text>
        <text x="116" y="136" class="mono soft" font-size="13">requests[].endpoint -&gt; api.endpoints[].id</text>
        <text x="116" y="160" class="mono soft" font-size="13">state_machine.to -&gt; ui.states[].id</text>
      </g>

      <g transform="translate(654 66)" filter="url(#card-shadow)">
        <rect width="620" height="184" rx="18" class="panel"/>
        <rect x="24" y="24" width="70" height="70" rx="16" fill="#173020" stroke="#2F7B42"/>
        <path d="M43 59 L56 72 L78 46" fill="none" stroke="#22C55E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="116" y="46" class="mono white" font-size="20" font-weight="720">validate-output.py</text>
        <text x="116" y="76" class="sans muted" font-size="15">Generated docs must cover the contract.</text>
        <text x="116" y="112" class="mono soft" font-size="13">required states -&gt; spec scenarios</text>
        <text x="116" y="136" class="mono soft" font-size="13">ui_to_event -&gt; notes or spec</text>
        <text x="116" y="160" class="mono soft" font-size="13">endpoint URLs -&gt; data-fetching.md</text>
      </g>
    </g>
  </g>

  <g id="footer" transform="translate(64 742)">
    <text class="mono muted" font-size="15">UI_Schema.yaml -> API_Schema.yaml -> Mapping_Logic.yaml -> notes.md + data-fetching.md + spec.md</text>
  </g>
</svg>
