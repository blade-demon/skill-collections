<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1664FF"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF7D00"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">design-to-spec — 架构总览</text>
  <text x="600" y="64" text-anchor="middle" font-size="13" fill="#718096">用确定性状态机包住 LLM 推断，YAML 契约传递事实，防止幻觉累积</text>

  <!-- ============== 输入区 ============== -->
  <g>
    <rect x="20" y="100" width="180" height="380" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5"/>
    <text x="110" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3748">输入</text>

    <rect x="40" y="150" width="140" height="60" rx="6" fill="#fff" stroke="#cbd5e0"/>
    <text x="110" y="175" text-anchor="middle" font-size="12" font-weight="600" fill="#1a202c">UI 设计稿</text>
    <text x="110" y="195" text-anchor="middle" font-size="10" fill="#718096">截图 / Figma / 草图</text>

    <rect x="40" y="230" width="140" height="60" rx="6" fill="#fff" stroke="#cbd5e0"/>
    <text x="110" y="255" text-anchor="middle" font-size="12" font-weight="600" fill="#1a202c">接口文档</text>
    <text x="110" y="275" text-anchor="middle" font-size="10" fill="#718096">OpenAPI / TS / MD</text>

    <rect x="40" y="310" width="140" height="60" rx="6" fill="#fff" stroke="#cbd5e0"/>
    <text x="110" y="335" text-anchor="middle" font-size="12" font-weight="600" fill="#1a202c">交互说明</text>
    <text x="110" y="355" text-anchor="middle" font-size="10" fill="#718096">触发 / 错误 / 缓存</text>

    <rect x="40" y="390" width="140" height="60" rx="6" fill="#fff" stroke="#cbd5e0" stroke-dasharray="4 3"/>
    <text x="110" y="415" text-anchor="middle" font-size="12" font-weight="600" fill="#4a5568">技术栈 / 设计系统</text>
    <text x="110" y="435" text-anchor="middle" font-size="10" fill="#a0aec0">来自 AGENTS.md (可选)</text>
  </g>

  <!-- ============== 4 阶段流程区 ============== -->
  <g>
    <rect x="240" y="100" width="640" height="380" rx="10" fill="#fefefe" stroke="#cbd5e0" stroke-width="1.5"/>
    <text x="560" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3748">4 阶段状态机（前 3 阶段需用户确认）</text>

    <!-- 阶段一 -->
    <g>
      <rect x="260" y="160" width="140" height="80" rx="8" fill="#1664FF"/>
      <text x="330" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">阶段 1</text>
      <text x="330" y="206" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">视觉提纯</text>
      <text x="330" y="225" text-anchor="middle" font-size="10" fill="#cfe0ff">LLM 推断</text>
    </g>

    <!-- 阶段二 -->
    <g>
      <rect x="420" y="160" width="140" height="80" rx="8" fill="#1664FF"/>
      <text x="490" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">阶段 2</text>
      <text x="490" y="206" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">接口提纯</text>
      <text x="490" y="225" text-anchor="middle" font-size="10" fill="#cfe0ff">LLM 推断</text>
    </g>

    <!-- 阶段三 -->
    <g>
      <rect x="580" y="160" width="140" height="80" rx="8" fill="#1664FF"/>
      <text x="650" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">阶段 3</text>
      <text x="650" y="206" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">逻辑映射</text>
      <text x="650" y="225" text-anchor="middle" font-size="10" fill="#cfe0ff">LLM 推断</text>
    </g>

    <!-- 阶段四 -->
    <g>
      <rect x="740" y="160" width="140" height="80" rx="8" fill="#FF7D00"/>
      <text x="810" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">阶段 4</text>
      <text x="810" y="206" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">规格组装</text>
      <text x="810" y="225" text-anchor="middle" font-size="10" fill="#ffe1cc">确定性脚本</text>
    </g>

    <!-- 阶段间箭头 -->
    <line x1="400" y1="200" x2="420" y2="200" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="560" y1="200" x2="580" y2="200" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="720" y1="200" x2="740" y2="200" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 三份契约（阶段 1-3 落盘） -->
    <g>
      <line x1="330" y1="240" x2="330" y2="270" stroke="#1664FF" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowBlue)"/>
      <rect x="265" y="280" width="130" height="80" rx="6" fill="#e6f0ff" stroke="#1664FF" stroke-width="1.5"/>
      <text x="330" y="304" text-anchor="middle" font-size="11" font-weight="700" fill="#1664FF">UI_Schema.yaml</text>
      <text x="330" y="324" text-anchor="middle" font-size="9" fill="#2d3748">components / states</text>
      <text x="330" y="340" text-anchor="middle" font-size="9" fill="#2d3748">/ layout / role</text>
      <text x="330" y="354" text-anchor="middle" font-size="9" fill="#718096">+ confidence 标签</text>
    </g>

    <g>
      <line x1="490" y1="240" x2="490" y2="270" stroke="#1664FF" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowBlue)"/>
      <rect x="425" y="280" width="130" height="80" rx="6" fill="#e6f0ff" stroke="#1664FF" stroke-width="1.5"/>
      <text x="490" y="304" text-anchor="middle" font-size="11" font-weight="700" fill="#1664FF">API_Schema.yaml</text>
      <text x="490" y="324" text-anchor="middle" font-size="9" fill="#2d3748">endpoints / fields</text>
      <text x="490" y="340" text-anchor="middle" font-size="9" fill="#2d3748">/ pagination / errors</text>
      <text x="490" y="354" text-anchor="middle" font-size="9" fill="#718096">+ open_questions</text>
    </g>

    <g>
      <line x1="650" y1="240" x2="650" y2="270" stroke="#1664FF" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowBlue)"/>
      <rect x="585" y="280" width="130" height="80" rx="6" fill="#e6f0ff" stroke="#1664FF" stroke-width="1.5"/>
      <text x="650" y="304" text-anchor="middle" font-size="11" font-weight="700" fill="#1664FF">Mapping_Logic.yaml</text>
      <text x="650" y="324" text-anchor="middle" font-size="9" fill="#2d3748">requests / bindings</text>
      <text x="650" y="340" text-anchor="middle" font-size="9" fill="#2d3748">/ state_machine</text>
      <text x="650" y="354" text-anchor="middle" font-size="9" fill="#718096">+ open_questions</text>
    </g>

    <!-- 三份契约 → 阶段四 -->
    <path d="M 330 360 Q 330 420 740 220" fill="none" stroke="#FF7D00" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
    <path d="M 490 360 Q 490 410 740 220" fill="none" stroke="#FF7D00" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
    <path d="M 650 360 Q 650 400 740 220" fill="none" stroke="#FF7D00" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

    <!-- 用户确认门 -->
    <g>
      <rect x="265" y="395" width="455" height="60" rx="6" fill="#fffbeb" stroke="#d97706" stroke-dasharray="4 3"/>
      <text x="492" y="418" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">⏸  用户确认门 — 每阶段先输出 ASCII 摘要等你确认</text>
      <text x="492" y="438" text-anchor="middle" font-size="10" fill="#92400e">不点头不进下一阶段；contracts/ 已落盘，新会话可从任意阶段接续</text>
    </g>

    <!-- 阶段四标注 -->
    <text x="810" y="270" text-anchor="middle" font-size="10" font-weight="600" fill="#FF7D00">读契约 → 填模板</text>
    <text x="810" y="285" text-anchor="middle" font-size="10" font-weight="600" fill="#FF7D00">不调用 LLM</text>
    <text x="810" y="312" text-anchor="middle" font-size="9" fill="#718096">scripts/</text>
    <text x="810" y="326" text-anchor="middle" font-size="9" fill="#718096">generate-output.js</text>
  </g>

  <!-- ============== 产物区 ============== -->
  <g>
    <rect x="920" y="100" width="260" height="380" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5"/>
    <text x="1050" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3748">产物（design-spec/&lt;name&gt;/）</text>

    <rect x="940" y="150" width="220" height="70" rx="6" fill="#fff" stroke="#7B61FF" stroke-width="1.5"/>
    <text x="1050" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#7B61FF">contracts/</text>
    <text x="1050" y="192" text-anchor="middle" font-size="10" fill="#2d3748">三份 YAML 事实契约</text>
    <text x="1050" y="208" text-anchor="middle" font-size="9" fill="#718096">ui / api / mapping</text>

    <rect x="940" y="232" width="220" height="70" rx="6" fill="#fff" stroke="#cbd5e0"/>
    <text x="1050" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">notes.md</text>
    <text x="1050" y="274" text-anchor="middle" font-size="10" fill="#2d3748">设计决策 + 数据契约</text>
    <text x="1050" y="290" text-anchor="middle" font-size="9" fill="#718096">+ 开放问题 + 计划提示</text>

    <rect x="940" y="314" width="220" height="70" rx="6" fill="#fff" stroke="#cbd5e0"/>
    <text x="1050" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">data-fetching.md</text>
    <text x="1050" y="356" text-anchor="middle" font-size="10" fill="#2d3748">请求链路 + 状态机</text>
    <text x="1050" y="372" text-anchor="middle" font-size="9" fill="#718096">前端开发者直接入口</text>

    <rect x="940" y="396" width="220" height="70" rx="6" fill="#fff" stroke="#cbd5e0"/>
    <text x="1050" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">specs/&lt;cap&gt;/spec.md</text>
    <text x="1050" y="438" text-anchor="middle" font-size="10" fill="#2d3748">OpenSpec 行为规格</text>
    <text x="1050" y="454" text-anchor="middle" font-size="9" fill="#718096">Requirement + Scenario</text>
  </g>

  <!-- 输入 → 阶段一 -->
  <line x1="200" y1="200" x2="240" y2="200" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段四 → 产物 -->
  <line x1="880" y1="200" x2="920" y2="200" stroke="#FF7D00" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- ============== 下游消费 ============== -->
  <g>
    <rect x="20" y="510" width="1160" height="140" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="600" y="538" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">下游消费 — 跨角色门禁包</text>

    <g>
      <rect x="50" y="558" width="190" height="70" rx="6" fill="#fff" stroke="#86efac"/>
      <text x="145" y="582" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">前端</text>
      <text x="145" y="600" text-anchor="middle" font-size="10" fill="#2d3748">data-fetching.md</text>
      <text x="145" y="616" text-anchor="middle" font-size="9" fill="#718096">+ /plan → 实现</text>
    </g>

    <g>
      <rect x="260" y="558" width="190" height="70" rx="6" fill="#fff" stroke="#86efac"/>
      <text x="355" y="582" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">后端</text>
      <text x="355" y="600" text-anchor="middle" font-size="10" fill="#2d3748">api-schema.yaml</text>
      <text x="355" y="616" text-anchor="middle" font-size="9" fill="#718096">→ 接口缺口清单</text>
    </g>

    <g>
      <rect x="470" y="558" width="190" height="70" rx="6" fill="#fff" stroke="#86efac"/>
      <text x="565" y="582" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">测试 / QA</text>
      <text x="565" y="600" text-anchor="middle" font-size="10" fill="#2d3748">spec.md Scenarios</text>
      <text x="565" y="616" text-anchor="middle" font-size="9" fill="#718096">→ 测试矩阵</text>
    </g>

    <g>
      <rect x="680" y="558" width="190" height="70" rx="6" fill="#fff" stroke="#86efac"/>
      <text x="775" y="582" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">PM / 设计</text>
      <text x="775" y="600" text-anchor="middle" font-size="10" fill="#2d3748">notes.md 开放问题</text>
      <text x="775" y="616" text-anchor="middle" font-size="9" fill="#718096">→ P0 评审会</text>
    </g>

    <g>
      <rect x="890" y="558" width="270" height="70" rx="6" fill="#fff" stroke="#86efac"/>
      <text x="1025" y="582" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">CI / 校验</text>
      <text x="1025" y="600" text-anchor="middle" font-size="10" fill="#2d3748">validate-output.js --strict</text>
      <text x="1025" y="616" text-anchor="middle" font-size="9" fill="#718096">→ trace 锚点完整性</text>
    </g>
  </g>

  <!-- 底部说明 -->
  <g>
    <text x="20" y="690" font-size="10" fill="#718096">
      <tspan font-weight="700" fill="#1664FF">●</tspan>
      <tspan> 蓝 = LLM 推断阶段（非确定性）</tspan>
      <tspan x="240" font-weight="700" fill="#FF7D00">●</tspan>
      <tspan> 橙 = 确定性阶段（脚本生成）</tspan>
      <tspan x="490" font-weight="700" fill="#7B61FF">●</tspan>
      <tspan> 紫 = 事实契约（阶段间唯一通信协议）</tspan>
      <tspan x="800" font-weight="700" fill="#86efac">●</tspan>
      <tspan> 绿 = 跨角色消费者</tspan>
    </text>
    <text x="600" y="708" text-anchor="middle" font-size="10" fill="#a0aec0">详见 SKILL.md / ONBOARDING.md / references/glossary.md</text>
  </g>
</svg>
